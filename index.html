<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mari - Auditoría de Flota</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; display: flex; justify-content: center; align-items: center; height: 100vh; color: #f8fafc; }

        .chat-container { width: 480px; height: 750px; background-color: #1e293b; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); display: flex; flex-direction: column; overflow: hidden; border: 1px solid #334155; }

        .chat-header { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #06b6d4; box-shadow: 0 4px 15px rgba(6, 182, 212, 0.2); }
        .header-info { display: flex; flex-direction: column; gap: 4px; }
        .header-title { font-size: 1.25rem; font-weight: 800; color: #06b6d4; text-shadow: 0 0 8px rgba(6,182,212,0.6); letter-spacing: 0.5px; }
        .header-subtitle { font-size: 0.75rem; color: #94a3b8; display: flex; align-items: center; gap: 6px; font-weight: 500; }
        .status-dot { width: 8px; height: 8px; background-color: #10b981; border-radius: 50%; box-shadow: 0 0 8px #10b981; }

        .screen-bezel { padding: 6px; background-color: #334155; border-radius: 12px; border: 1px solid #475569; box-shadow: inset 0 4px 6px rgba(0,0,0,0.5), 0 4px 10px rgba(0,0,0,0.3); }
        .screen-container { width: 100px; height: 65px; background-color: #020617; border-radius: 6px; border: 1px solid #06b6d4; box-shadow: inset 0 0 15px rgba(6, 182, 212, 0.2); display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; overflow: hidden; transition: all 0.3s ease; }
        .screen-container::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%); background-size: 100% 4px; pointer-events: none; z-index: 10; opacity: 0.5; }

        .bot-face { display: flex; justify-content: center; align-items: center; gap: 15px; z-index: 5; }
        .eye { width: 22px; height: 22px; border: 4px solid #06b6d4; border-top: none; border-radius: 0 0 25px 25px; box-shadow: 0 0 10px #06b6d4; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .thinking-text { position: absolute; bottom: 4px; font-size: 0.6rem; color: #fde047; text-shadow: 0 0 5px #fde047; opacity: 0; transition: opacity 0.3s ease; font-family: monospace; font-weight: bold; z-index: 5; }

        .thinking-active .screen-container { border-color: #fde047; box-shadow: inset 0 0 15px rgba(253, 224, 71, 0.2); }
        .thinking-active .eye { height: 4px; width: 20px; border: none; border-radius: 2px; background-color: #fde047; box-shadow: 0 0 10px #fde047; animation: scanPulse 0.5s infinite alternate; }
        .thinking-active .eye:nth-child(2) { animation-delay: 0.25s; }
        .thinking-active .thinking-text { opacity: 1; }
        @keyframes scanPulse { 0% { transform: scaleX(0.7); opacity: 0.4; } 100% { transform: scaleX(1.3); opacity: 1; } }

        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        .message { max-width: 80%; padding: 12px 18px; border-radius: 18px; font-size: 0.95rem; line-height: 1.5; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .user-message { background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%); align-self: flex-end; border-bottom-right-radius: 4px; color: white; }
        .bot-message { background-color: #334155; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #475569; color: #f8fafc; }
        
        .chat-input-area { display: flex; padding: 15px; background-color: #0f172a; border-top: 1px solid #334155; align-items: center; }
        .chat-input-area input { flex: 1; padding: 14px; border: 1px solid #475569; border-radius: 25px; outline: none; font-size: 1rem; padding-left: 20px; background-color: #1e293b; color: #f8fafc; transition: border 0.3s, box-shadow 0.3s; }
        .chat-input-area input:focus { border-color: #06b6d4; box-shadow: 0 0 8px rgba(6, 182, 212, 0.3); }

        .mic-icon { font-size: 1.3rem; color: #94a3b8; cursor: pointer; padding: 0 10px; transition: all 0.3s; }
        .mic-icon:hover { color: #06b6d4; transform: scale(1.1); }
        .mic-grabando { color: #ef4444 !important; text-shadow: 0 0 10px #ef4444; animation: parpadeoMicro 1s infinite alternate; }
        @keyframes parpadeoMicro { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.2); opacity: 0.6; } }

        .chat-input-area button { background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%); color: white; border: none; padding: 0 25px; height: 45px; margin-left: 10px; border-radius: 25px; font-weight: bold; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .chat-input-area button:hover { transform: scale(1.05); box-shadow: 0 4px 10px rgba(6, 182, 212, 0.4); }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header" id="chatHeader">
            <div class="header-info">
                <div class="header-title">Panel de Seguridad Mari</div>
                <div class="header-subtitle"><div class="status-dot"></div> Monitor de Alcoholímetros Activo</div>
            </div>
            <div class="screen-bezel">
                <div class="screen-container">
                    <div class="bot-face"><div class="eye"></div><div class="eye"></div></div>
                    <div class="thinking-text">PROCESANDO</div>
                </div>
            </div>
        </div>
        
        <div class="chat-messages" id="chatBox">
            <div class="message bot-message">Sistemas de monitoreo en línea. Soy Mari, lista para auditar las lecturas del alcoholímetro. Usa el micrófono o escribe un comando.</div>
        </div>
        
        <div class="chat-input-area">
            <span class="mic-icon" id="btnMicrofono" title="Hablar con Mari" onclick="iniciarMicrofono()">🎙️</span>
            <input type="text" id="userInput" placeholder="Ingresa un comando de seguridad..." autocomplete="off" onkeypress="evaluarEnter(event)">
            <button onclick="enviarMensaje()">Enviar</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const chatHeader = document.getElementById('chatHeader');
        const btnMicrofono = document.getElementById('btnMicrofono');

        // --- SISTEMA DE SÍNTESIS DE VOZ FEMENINA ---
        function hablar(texto) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();

                const mensajeVoz = new SpeechSynthesisUtterance(texto);
                mensajeVoz.lang = 'es-ES'; 
                mensajeVoz.rate = 1.05;     
                mensajeVoz.pitch = 1.3; // Tono ajustado para asegurar voz femenina    

                const voces = window.speechSynthesis.getVoices();
                const vocesFemeninasConocidas = ['Helena', 'Laura', 'Dalia', 'Monica', 'Paulina', 'Luciana', 'Sabina', 'Victoria', 'Mia', 'Google español'];
                
                let vozElegida = voces.find(v => v.lang.includes('es') && vocesFemeninasConocidas.some(nombre => v.name.includes(nombre)));

                if (!vozElegida) {
                    vozElegida = voces.find(v => v.lang.includes('es') && !v.name.includes('Pablo') && !v.name.includes('Diego') && !v.name.includes('Jorge'));
                }

                if (vozElegida) {
                    mensajeVoz.voice = vozElegida;
                }

                window.speechSynthesis.speak(mensajeVoz);
            } else {
                console.error("Este navegador no soporta salida de voz.");
            }
        }

        // --- SALUDO INICIAL ---
        let yaSaludo = false;
        function activarSaludoInicial() {
            if (!yaSaludo) {
                hablar("Sistemas de monitoreo en línea. Soy Mari, lista para auditar las lecturas del alcoholímetro.");
                yaSaludo = true;
                document.removeEventListener('click', activarSaludoInicial);
            }
        }
        document.addEventListener('click', activarSaludoInicial);


        // --- RECONOCIMIENTO DE VOZ ---
        const ReconocimientoVoz = window.SpeechRecognition || window.webkitSpeechRecognition;
        let reconocimiento;

        if (ReconocimientoVoz) {
            reconocimiento = new ReconocimientoVoz();
            reconocimiento.lang = 'es-ES'; 
            reconocimiento.continuous = false; 
            reconocimiento.interimResults = false;

            reconocimiento.onstart = function() {
                btnMicrofono.classList.add('mic-grabando');
                userInput.placeholder = "Escuchando...";
            };

            reconocimiento.onspeechend = function() {
                reconocimiento.stop();
                btnMicrofono.classList.remove('mic-grabando');
                userInput.placeholder = "Ingresa un comando de seguridad...";
            };

            reconocimiento.onresult = function(event) {
                const transcripcion = event.results[0][0].transcript;
                userInput.value = transcripcion; 
                enviarMensaje(); 
            };

            reconocimiento.onerror = function(event) {
                btnMicrofono.classList.remove('mic-grabando');
                userInput.placeholder = "Error al escuchar. Intenta de nuevo.";
                setTimeout(() => userInput.placeholder = "Ingresa un comando de seguridad...", 3000);
            };
        } else {
            btnMicrofono.style.display = 'none'; 
        }

        function iniciarMicrofono() {
            if (reconocimiento) {
                yaSaludo = true; 
                reconocimiento.start();
            } else {
                alert("Tu navegador no soporta esta función. Usa Edge o Chrome.");
            }
        }


        // --- COMUNICACIÓN CON EL SERVIDOR RENDER ---
        async function enviarMensaje() {
            const texto = userInput.value.trim();
            if (texto === "") return;

            yaSaludo = true; 
            agregarMensajeAConversacion(texto, 'user-message');
            userInput.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;
            chatHeader.classList.add('thinking-active');

            try {
                const response = await fetch('https://mari-fkxq.onrender.com/preguntar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ texto: texto })
                });
                
                const data = await response.json();
                agregarMensajeAConversacion(data.respuesta, 'bot-message');
                hablar(data.respuesta); 
                
            } catch (error) {
                console.error("Error:", error);
                const msgError = "Error crítico de conexión con el servidor de la flota.";
                agregarMensajeAConversacion(msgError, 'bot-message');
                hablar(msgError);
            } finally {
                chatHeader.classList.remove('thinking-active');
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        function agregarMensajeAConversacion(texto, clase) {
            const nuevoMensaje = document.createElement('div');
            nuevoMensaje.classList.add('message', clase);
            nuevoMensaje.innerText = texto;
            chatBox.appendChild(nuevoMensaje);
        }

        function evaluarEnter(event) {
            if (event.key === "Enter") enviarMensaje();
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.getVoices();
        }
    </script>
</body>
</html>
